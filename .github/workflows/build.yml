name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Pure Monolithic BIN
      run: |
        # Используем tar вместо zip: он склеивает файлы в чистый бинарный поток
        # Без сжатия, без скрытых тегов времени и БЕЗ заголовков ZIP-архивов
        tar -cf watchface.bin watchface.json assets/

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
