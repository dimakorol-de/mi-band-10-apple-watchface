name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Monolithic HyperOS BIN
      run: |
        # Склеиваем файлы в монолитный бинарный поток БЕЗ заголовков ZIP-архива
        # Этот файл не будет открываться как папка на телефоне и встанет без ошибок
        cat watchface.json > watchface.bin
        for i in {0..9}; do
          if [ -f "assets/Stretched_${i}.png" ]; then
            cat "assets/Stretched_${i}.png" >> watchface.bin
          fi
        done

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
