name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Pure Monolithic BIN
      run: |
        # -0: Режим STORED без сжатия байтов (требование HyperOS)
        # -X: Полностью вырезает Extra Fields (Айфон перестанет открывать файл как папку)
        zip -0X watchface.bin watchface.json assets/Stretched_*.png

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
