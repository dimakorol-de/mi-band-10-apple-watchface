name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Pure HyperOS BIN
      run: |
        # Собираем .bin напрямую из твоих картинок БЕЗ тегов Linux (UT), чтобы убрать ошибку -1
        zip -0rX AppleStyleFixed.bin watchface.json assets/

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: watchface-pack
        path: AppleStyleFixed.bin
