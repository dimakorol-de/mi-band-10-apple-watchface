name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Official HyperOS RPK via Linux Zip
      run: |
        # Упаковываем файлы без системных тегов Linux (параметр -X), чтобы убрать ошибку прошивки
        zip -0rX AppleStyleFixed.rpk watchface.json assets/

    - name: Upload Finished Watchface (.rpk)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: AppleStyleFixed.rpk
