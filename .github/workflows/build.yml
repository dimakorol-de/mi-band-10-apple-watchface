name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Monolithic HyperOS BIN
      run: |
        # -0: Без сжатия байтов (требование прошивки часов)
        # -r: Строгое сохранение путей к картинкам (чтобы архив не ломался)
        # -X: Полностью вырезает Extra Fields (бинарник не будет открываться как папка)
        zip -0rX watchface.bin watchface.json assets/

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
