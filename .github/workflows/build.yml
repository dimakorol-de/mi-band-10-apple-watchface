name: Build and Pack Watchface

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Flat Directory
        run: |
          mkdir -p clean_project
          # Копируем только актуальные файлы под архитектуру HyperOS
          cp main.lua clean_project/
          cp app.json clean_project/
          cp -r assets clean_project/

      - name: Upload Raw Source Folder
        uses: actions/upload-artifact@v4
        with:
          name: mi-band-10-apple-watchface-source
          path: clean_project/
