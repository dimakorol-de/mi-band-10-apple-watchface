name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Monolithic HyperOS BIN
      run: |
        # -0: Без сжатия (требование HyperOS)
        # -j: Мусорные пути Linux не пишутся в имена файлов
        # -X: Полностью вырезает Extra Fields (телефон перестанет видеть архив как папку)
        zip -0jX watchface.bin watchface.json assets/Stretched_*.png

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
