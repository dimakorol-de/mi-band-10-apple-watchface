name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pillow
      run: pip install Pillow

    - name: Generate Perfect Digits from Font
      run: python generate_assets.py

    - name: Compile Official HyperOS BIN via Native Compiler
      run: |
        python -c "
        import zipfile, os
        with zipfile.ZipFile('AppleStyleFixed.bin', 'w', compression=zipfile.ZIP_STORED) as z:
            z.write('watchface.json', 'watchface.json')
            for i in range(10):
                z.write(f'assets/Stretched_{i}.png', f'assets/Stretched_{i}.png')
        "

    - name: Upload Finished Watchface
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: AppleStyleFixed.bin
