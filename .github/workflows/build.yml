name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Official HyperOS Face Package
      run: |
        # Собираем монолитный фабричный пакет .face без сжатия байтов (-0)
        # Параметр -X вырезает Extra Fields, убирая ошибки распознавания на iPhone
        zip -0rX AppleStyleFixed.face watchface.json assets/

    - name: Upload Finished Watchface (.face)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: AppleStyleFixed.face
