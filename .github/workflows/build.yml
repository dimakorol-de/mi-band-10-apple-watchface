name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Pure Monolithic BIN
      run: |
        # Склеиваем файлы в монолитный бинарный поток по стандартам Vela OS
        tar -cf watchface.bin watchface.json assets/

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        # Принудительно заставляем сервер выдать чистый готовый .bin
        name: AppleStyleFixed.bin
        path: watchface.bin
