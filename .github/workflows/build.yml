name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Official HyperOS BIN
      run: |
        # -0 означает режим STORED (без сжатия байтов, критично для Mi Fitness)
        # -X вырезает лишние метаданные Linux (убирает ошибку -1)
        zip -0rX watchface.bin watchface.json assets/

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
