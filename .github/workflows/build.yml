name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare Flat Directory
      run: |
        mkdir -p clean_project
        cp watchface.json clean_project/
        cp -r assets clean_project/

    - name: Upload Raw Source Folder
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: clean_project/
