name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Official HyperOS BIN via Linux Zip
      run: |
        # Принудительно собираем циферблат в расширении .bin с отключением Unix-тегов времени (-X)
        zip -0rX watchface.bin watchface.json assets/

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
