name: Build and Pack HyperOS BIN

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Watchface Folder
        run: |
          mkdir -p project_dir
          cp main.lua project_dir/
          cp app.json project_dir/
          cp -r assets project_dir/

      - name: Pack to BIN Container
        run: |
          cd project_dir
          # Упаковываем файлы без сжатия (флаг -0), как того требует HyperOS для быстрого чтения из памяти
          zip -0 -r ../resource.bin main.lua app.json assets/
          cd ..

      - name: Upload Finished BIN File
        uses: actions/upload-artifact@v4
        with:
          name: Apple_Watchface_MiBand10_BIN
          path: resource.bin
