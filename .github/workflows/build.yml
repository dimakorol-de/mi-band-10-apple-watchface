name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare Clean Directory for Upload
      run: |
        # Создаем чистую временную папку и копируем туда только самое необходимое
        mkdir -p build_flat
        cp watchface.json build_flat/
        cp -r assets build_flat/

    - name: Upload Clean Files Without Compression
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: build_flat/
