name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Packager Library
      run: npm install archiver

    - name: Compile Official HyperOS BIN
      run: |
        node -e "
        const fs = require('fs');
        const archiver = require('archiver');
        const output = fs.createWriteStream('watchface.bin');
        const archive = archiver.create('zip', { store: true });
        
        output.on('close', () => console.log('Сборка завершена!'));
        archive.pipe(output);
        
        archive.file('watchface.json', { name: 'watchface.json' });
        
        for(let i=0; i<=9; i++) {
          archive.file('assets/Stretched_' + i + '.png', { name: 'assets/Stretched_' + i + '.png' });
        }
        
        archive.finalize();
        "

    - name: Upload Finished Watchface (.bin)
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: watchface.bin
