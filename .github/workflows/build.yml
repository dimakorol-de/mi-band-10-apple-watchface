name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pillow
      run: pip install Pillow

    - name: Generate Perfect Digits
      run: python generate_assets.py

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Official Xiaomi Watchface Tool
      run: npm install -g @xiaomi/watchface-cli

    - name: Compile Official HyperOS BIN
      run: |
        xiaomi-wf build --config watchface.json --output ./dist
        # Переименовываем выходной файл для удобства
        mv ./dist/*.bin ./dist/AppleStyleFixed.bin

    - name: Upload Finished Watchface
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: ./dist/AppleStyleFixed.bin
