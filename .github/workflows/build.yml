name: Build Mi Band 10 Watchface

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pillow
      run: pip install Pillow

    - name: Generate Perfect Digits from Font
      run: python generate_assets.py

    - name: Compile Official HyperOS BIN via Native Console
      run: |
        # Используем стандартную консольную утилиту zip, которую понимает мод Mi Fitness
        zip -0r AppleStyleFixed.bin watchface.json assets/

    - name: Upload Finished Watchface
      uses: actions/upload-artifact@v4
      with:
        name: AppleStyleMinimal-MiBand10
        path: AppleStyleFixed.bin
